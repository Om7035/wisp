[package]
name = "device-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
telemetry = { path = "../telemetry" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
